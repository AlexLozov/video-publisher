[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "video-publisher"
version = "0.1.0"
description = "Desktop app that publishes a video to several social networks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pywebview>=5.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["core"]

[tool.setuptools.package-data]
video_publisher = ["storage/migrations/*.py", "storage/migrations/*.mako", "storage/migrations/versions/*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["core", "desktop", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "core"
packages = ["video_publisher"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["webview", "webview.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core"]
addopts = "--strict-markers -m 'not integration' --cov=video_publisher --cov-report=term-missing"
markers = [
    "integration: calls real platform APIs; run explicitly with `pytest -m integration`",
]

[tool.coverage.run]
source = ["video_publisher"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
